[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaigent"
version = "0.5.6"
description = "All your agents in one place. Web + files, any provider, undo, MCP and serve."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "jaime-gaming" }]
keywords = ["agent", "llm", "ai", "cli", "tools", "web-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  # A terminal emulator, so tests can assert on what a real tty would show
  # rather than on the escape sequences we happen to emit.
  "pyte>=0.8",
  # Parsing the GitHub Actions workflows, and inspecting the Windows icon.
  "pyyaml>=6.0",
  "pillow>=10.0",
  # Lint the installer scripts locally, with the same tool CI uses.
  "shellcheck-py>=0.10",
  # Turn test failures into GitHub annotations, so they appear on the PR diff
  # instead of only inside a job log.
  "pytest-github-actions-annotate-failures>=0.2",
]
# Everything needed to build the standalone binaries.
build = [
  "pyinstaller>=6.0",
]
# Security tooling, matching what CI runs.
security = [
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/jaime-gaming/jaigent"
Repository = "https://github.com/jaime-gaming/jaigent"
Issues = "https://github.com/jaime-gaming/jaigent/issues"

[project.scripts]
jaigent = "jaigent.cli:main"
# A short alias, for the same reason `git` is not `git-version-control`.
jgt = "jaigent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jaigent"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/jaigent"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:jaigent.*"]

[tool.coverage.run]
source = ["src/jaigent"]
