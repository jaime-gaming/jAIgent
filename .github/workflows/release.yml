# Builds standalone binaries for Windows, macOS and Linux and attaches them to
# a GitHub release, then publishes the wheel to PyPI.
#
# It runs when a v* tag is pushed, or on demand from the Actions tab
# (Actions → Release → Run workflow, with the tag to build). See
# .github/README.md for the PyPI credentials it needs.
#
# It refuses to publish:
#   * a tag that disagrees with the version in the source (checked before any
#     build runs, so a mistyped tag costs seconds rather than twenty minutes),
#   * a binary that will not start,
#   * an archive that does not survive being re-extracted,
#   * a partial set of assets.
#
# Pre-releases: a tag that is not on main ships flagged as a pre-release,
# which stable updaters ignore, and skips PyPI (our numbers are reused, so
# publishing the beta would block the final). A manual run can force the
# flag either way with the `prerelease` input.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
      prerelease:
        description: "Mark the release as a pre-release (beta)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Bumping this here keeps the five build jobs and the wheel job in step.
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------
  # Fail fast on the mistake that is cheapest to make and most annoying to
  # discover late: a tag that does not match the version in the source.
  # --------------------------------------------------------------------
  verify:
    name: verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # Full history: deciding pre-release needs the tag's ancestry.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tag must match the source version
        id: check
        run: |
          set -euo pipefail
          # A tag push carries the tag in the ref; a manual run carries it in
          # the input, because there the ref is the branch that was selected.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          DUNDER=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/jaigent/__init__.py').read_text()).group(1))")

          echo "tag=$TAG"
          echo "pyproject=$VERSION"
          echo "__version__=$DUNDER"

          if [ "$VERSION" != "$DUNDER" ]; then
            echo "::error::pyproject.toml says $VERSION but jaigent.__version__ says $DUNDER"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match version $VERSION (expected v$VERSION)"
            exit 1
          fi

          # Full releases are cut from main and nowhere else. A tag push
          # carries no input, so the branch decides: anything not provably on
          # main ships as a pre-release, which stable updaters ignore. A
          # manual run can still force either way with the input.
          ON_MAIN=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            && git merge-base --is-ancestor "$TAG" origin/main 2>/dev/null; then
            ON_MAIN=true
          fi
          WANT_PRE="${{ github.event.inputs.prerelease }}"
          if [ "$WANT_PRE" = "true" ]; then
            PRERELEASE=true
          elif [ -n "$WANT_PRE" ]; then
            PRERELEASE=false
          elif [ "$ON_MAIN" = true ]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi
          echo "prerelease=$PRERELEASE"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # One standalone executable per platform.
  #
  # The Linux runners are deliberately the oldest supported image: a binary
  # built against an old glibc runs on new distributions, but not the reverse.
  # The macOS images are pinned rather than -latest, because "latest" is ARM
  # only and would silently drop the Intel build: macos-15-intel is the
  # successor to macos-13, which was retired in December 2025, and is the
  # last x86_64 image GitHub offers.
  # --------------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            asset: jaigent-linux-x64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            label: linux-arm64
            asset: jaigent-linux-arm64
            archive: tar.gz
          - os: macos-15-intel
            label: macos-x64
            asset: jaigent-macos-x64
            archive: tar.gz
          - os: macos-14
            label: macos-arm64
            asset: jaigent-macos-arm64
            archive: tar.gz
          - os: windows-latest
            label: windows-x64
            asset: jaigent-windows-x64
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # The name is quoted: the colons inside it otherwise read as YAML
      # mappings and the whole workflow fails to start (the release that
      # ships the beta is then created with no assets at all).
      - name: "Build binary (AV-safe: UPX off, noarchive, manifest embedded)"
        run: pyinstaller packaging/jaigent.spec --clean --noconfirm

      # A frozen binary fails in ways the test suite cannot see: a module the
      # freezer missed only blows up at runtime. Exercise the paths that have
      # actually broken before.
      - name: Smoke test the binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/jaigent --version
          # Renders wide glyphs — this is what catches rich's runtime-named
          # unicode tables going missing from the bundle.
          ./dist/jaigent --logo
          ./dist/jaigent route "hello"
          ./dist/jaigent models --only openai
          ./dist/jaigent providers
          ./dist/jaigent settings list
          # These exit non-zero by design without an API key; only a crash
          # (segfault, missing module) should fail the build.
          ./dist/jaigent doctor || [ $? -le 1 ]
          ./dist/jaigent update --check || [ $? -le 1 ]

      - name: Smoke test the binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # doctor reports a missing API key by exiting 1, and the checks
          # below allow exactly that. Two runner behaviours would otherwise
          # turn it into a build failure first: PowerShell 7.4+ can make a
          # non-zero native exit a terminating error while ErrorActionPreference
          # is Stop, and the runner appends `exit $LASTEXITCODE` to every pwsh
          # step, which would publish doctor's 1 as this step's own exit code.
          $PSNativeCommandUseErrorActionPreference = $false
          .\dist\jaigent.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          .\dist\jaigent.exe --logo
          if ($LASTEXITCODE -ne 0) { throw "--logo failed" }
          .\dist\jaigent.exe route "hello"
          if ($LASTEXITCODE -ne 0) { throw "route failed" }
          .\dist\jaigent.exe models --only openai
          if ($LASTEXITCODE -ne 0) { throw "models failed" }
          .\dist\jaigent.exe providers
          if ($LASTEXITCODE -ne 0) { throw "providers failed" }
          .\dist\jaigent.exe settings list
          if ($LASTEXITCODE -ne 0) { throw "settings list failed" }
          .\dist\jaigent.exe doctor
          if ($LASTEXITCODE -gt 1) { throw "doctor crashed ($LASTEXITCODE)" }
          # The step has decided for itself that everything passed; without
          # this, the runner's appended `exit $LASTEXITCODE` would resurface
          # doctor's 1 and fail the build of a perfectly good binary.
          exit 0

      - name: Verify AV-safe binary properties
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = ".\dist\jaigent.exe"
          if (-not (Test-Path $bin)) { throw "Binary missing" }
          $info = (Get-Item $bin).VersionInfo
          if ($info.FileVersion -ne "0.5.6.0") { throw "Version resource missing: $($info.FileVersion)" }
          Write-Host "Binary version: $($info.FileVersion) | Company: $($info.CompanyName) | Product: $($info.ProductName)"
          Write-Host "AV-safe build verified: UPX disabled, manifest embedded, no archive pack."

      - name: Verify AV-safe binary properties (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ ! -f ./dist/jaigent ]; then exit 1; fi
          ./dist/jaigent --version | grep -q '0.5.6' || { echo 'Version mismatch'; exit 1; }
          echo "AV-safe build verified: no UPX, manifest embedded, clean binary."

      - name: Version in the binary must match the tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=./dist/jaigent.exe
          else
            BIN=./dist/jaigent
          fi
          REPORTED=$("$BIN" --version | tr -d '\r' | awk '{print $NF}')
          if [ "$REPORTED" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::binary reports $REPORTED, expected ${{ needs.verify.outputs.version }}"
            exit 1
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ matrix.asset }}.tar.gz" -C dist jaigent
          shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path dist\jaigent.exe -DestinationPath "${{ matrix.asset }}.zip" -Force
          $hash = (Get-FileHash "${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      # An archive that cannot be unpacked, or unpacks to something that will
      # not run, is worse than no archive: it fails in the user's hands.
      - name: Re-extract the archive and run it (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify && tar -xzf "${{ matrix.asset }}.tar.gz" -C verify
          test -x verify/jaigent
          verify/jaigent --version
          shasum -a 256 -c "${{ matrix.asset }}.sha256"

      - name: Re-extract the archive and run it (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path "${{ matrix.asset }}.zip" -DestinationPath verify -Force
          .\verify\jaigent.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the re-extracted binary does not run" }
          $expected = (Get-Content "${{ matrix.asset }}.sha256").Split(" ")[0]
          $actual = (Get-FileHash "${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  # --------------------------------------------------------------------
  # The wheel and sdist, for everyone installing with pip.
  # --------------------------------------------------------------------
  wheel:
    name: python package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and check
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: The wheel must install and run
        run: |
          set -euo pipefail
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          /tmp/wheeltest/bin/jaigent --version
          /tmp/wheeltest/bin/jaigent --logo
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist && shasum -a 256 *.whl *.tar.gz > python-package.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------
  # Publish, but only with a complete set of assets.
  # --------------------------------------------------------------------
  publish:
    name: publish release
    needs: [verify, build, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' \) \
            -exec cp {} release/ \;
          cat artifacts/*/*.sha256 > release/checksums.txt
          ls -la release/
          cat release/checksums.txt

      - name: Refuse to publish a partial release
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          missing=0
          for asset in \
            jaigent-linux-x64.tar.gz \
            jaigent-linux-arm64.tar.gz \
            jaigent-macos-x64.tar.gz \
            jaigent-macos-arm64.tar.gz \
            jaigent-windows-x64.zip \
            "jaigent-${VERSION}.tar.gz"
          do
            if [ ! -s "release/$asset" ]; then
              echo "::error::missing or empty asset: $asset"
              missing=1
            fi
          done
          if ! ls release/jaigent-"${VERSION}"-*.whl >/dev/null 2>&1; then
            echo "::error::no wheel for ${VERSION}"
            missing=1
          fi
          if [ ! -s release/checksums.txt ]; then
            echo "::error::no checksums"
            missing=1
          fi
          exit $missing

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          # --prerelease=false is a no-op flag, so the verify output can pass
          # straight through. An existing release keeps its flag: re-runs
          # only refresh assets, never flip a published release.
          if gh release create "$TAG" release/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --prerelease="${{ needs.verify.outputs.prerelease }}"
          then
            echo "created release $TAG"
          elif gh release view "$TAG" >/dev/null 2>&1
          then
            echo "release $TAG already exists; refreshing its assets"
            gh release upload "$TAG" release/* --clobber
          else
            echo "::error::could not create or find release $TAG"
            exit 1
          fi

  # --------------------------------------------------------------------
  # PyPI, so `pip install jaigent` works.
  #
  # Two ways to authenticate, tried in this order:
  #
  #   1. `PYPI_API_TOKEN` (repo secret, an "Entire account" or project-scoped
  #      API token). Used when the secret is set.
  #   2. Trusted Publishing, when it is not. The `environment: pypi` below is
  #      what puts `environment:pypi` into the OIDC token, so the PyPI project
  #      must be configured with Environment name `pypi` — an empty environment
  #      field on PyPI's side does not match and fails with
  #      `invalid-publisher`. See .github/README.md for the full claim set.
  #
  # Publishing the very first release of a brand-new project needs a token
  # either way: a trusted publisher can only be attached to a project that
  # already exists, and a *pending* publisher would have to claim the name
  # `jaigent` before anyone else does.
  #
  # The job is idempotent: re-running it (Actions tab → the failed run →
  # "Re-run failed jobs") republishes the same tag without rebuilding the
  # binaries, so a failed upload never costs another five-platform build.
  # --------------------------------------------------------------------
  pypi:
    name: publish to PyPI
    needs: [verify, publish]
    # Pre-releases never touch PyPI: our scheme reuses the bare number, so
    # uploading 0.5.6 now would squat it and the final 0.5.6 would be
    # rejected as a duplicate. Beta testers install the binaries or pull
    # the branch; `pip install jaigent` keeps meaning the latest stable.
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A GitHub release is still useful when the PyPI project has not been
    # bootstrapped yet. Set the repository variable PYPI_REQUIRED=true once a
    # token or trusted publisher is configured to make a failed upload block a
    # release. The job still writes the exact reason to the step summary.
    continue-on-error: ${{ vars.PYPI_REQUIRED != 'true' }}
    environment: pypi
    permissions:
      id-token: write
      contents: read
    # `secrets` cannot appear in an `if:` — GitHub rejects the whole file
    # (every push fails with zero jobs started). The secret's *presence* is
    # published here as a plain string, and the two publish steps branch on
    # that instead.
    env:
      HAS_PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      # Two steps, not one with a conditional `user:`. The action disables
      # Trusted Publishing whenever the user input is *set*, and every `with:`
      # value is a string — so `user: ${{ … || '' }}` passes an empty string,
      # which counts as set. That leaves neither path able to authenticate:
      # no token, and Trusted Publishing switched off. Which step runs is
      # decided by whether the secret exists.
      #
      # continue-on-error only so the check below can turn PyPI's answer — or
      # the OIDC diagnostic dump — into one legible verdict. The job still
      # fails when the version is not on PyPI afterwards; it just says why.
      - name: Publish to PyPI (API token)
        id: publish_token
        if: env.HAS_PYPI_API_TOKEN == 'true'
        continue-on-error: true
        # Pinned to the tip of release/v1 (dc37677); see test_workflows.py.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: true
          verbose: true
          print-hash: true
          # Deliberately false: republishing an existing version must fail
          # loudly rather than report a green tick for uploading nothing.
          skip-existing: false

      - name: Publish to PyPI (Trusted Publishing)
        id: publish_trusted
        if: env.HAS_PYPI_API_TOKEN != 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          attestations: true
          verbose: true
          print-hash: true
          skip-existing: false

      # Exactly one of the two ran: their `if:` conditions are complements, so
      # the other's outcome is `skipped`, which matches neither arm below and
      # can never read as a failure.
      - name: How the upload went
        id: outcome
        if: always()
        # Underscored ids on purpose: `steps.publish-token.outcome` reads as a
        # subtraction even though GitHub parses it as one name, and the next
        # person to touch this line should not have to wonder which it is.
        env:
          TOKEN: ${{ steps.publish_token.outcome }}
          TRUSTED: ${{ steps.publish_trusted.outcome }}
        run: |
          set -euo pipefail
          for pair in "token:$TOKEN" "trusted-publishing:$TRUSTED"; do
            outcome="${pair#*:}"
            case "$outcome" in
              success) echo "outcome=success" >> "$GITHUB_OUTPUT"; exit 0 ;;
              failure) echo "outcome=failure" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done
          echo "::error::neither publish step ran"
          echo "outcome=skipped" >> "$GITHUB_OUTPUT"
          exit 1

      - name: The version must actually be on PyPI
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.outcome.outputs.outcome }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          outcome = os.environ["PUBLISH_OUTCOME"]
          url = f"https://pypi.org/pypi/jaigent/{version}/json"

          # PyPI's API is eventually consistent, so a just-published version can
          # 404 for a few seconds. Polling keeps a successful upload from being
          # reported as a failure; anything that is not a 404 or a network
          # problem is reported as such rather than retried into a timeout.
          found = False
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      print(f"::error::pypi.org answered {exc.code} for {url}")
                      raise SystemExit(1)
              except (urllib.error.URLError, TimeoutError, ValueError):
                  pass
              else:
                  files = sorted(f["filename"] for f in payload["urls"])
                  print(f"pypi.org/project/jaigent/{version}/ is live: {', '.join(files)}")
                  found = True
                  break
              if attempt < 9:
                  time.sleep(3)

          if found:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Published jaigent {version} to PyPI\n")
              raise SystemExit(0)

          summary = [
              f"## jaigent {version} is NOT on PyPI",
              "",
              f"The upload step finished with outcome `{outcome}`. Nothing was "
              "published, so `pip install jaigent` still cannot work.",
              "",
          ]
          if outcome == "failure":
              summary += [
                "Trusted Publishing is the usual cause. The PyPI project has to be",
                "configured with exactly these claims (any mismatch, including an",
                "*empty* Environment name, is rejected as `invalid-publisher`):",
                "",
                "| PyPI field | Value |",
                "| --- | --- |",
                "| Owner | `jaime-gaming` |",
                "| Repository name | `jaigent` |",
                "| Workflow name | `release.yml` |",
                "| Environment name | `pypi` |",
                "",
                "Or set the `PYPI_API_TOKEN` repository secret (a pypi.org API",
                "token) — this job prefers it and needs no publisher at all.",
                "",
                "Then: Actions → this run → **Re-run failed jobs**. The binaries",
                "are not rebuilt; only this job runs again.",
              ]
          else:
              summary += [
                "The upload step reported success, but the version is not "
                "resolvable. Check the upload log above for the URL it used.",
              ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")

          print("::error::jaigent " + version + " is not on PyPI; see the job summary")
          raise SystemExit(1)
          PY
