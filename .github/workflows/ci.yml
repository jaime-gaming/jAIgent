name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Every supported Python on Linux, plus both other platforms on the
          # oldest and newest supported versions so packaging bugs surface early.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Smoke test the CLI
        # bash on purpose: the health check has a documented exit code of 1
        # when no API key is configured. The default Windows shell is pwsh,
        # where the small POSIX status check below is not portable. Pinning the
        # shell also prevents a runner upgrade from changing this behaviour.
        shell: bash
        run: |
          set -euo pipefail
          jaigent --version
          set +e
          jaigent doctor
          doctor_status=$?
          set -e
          if [ "$doctor_status" -gt 1 ]; then
            echo "doctor crashed with exit code $doctor_status"
            exit "$doctor_status"
          fi
          jaigent route "hello"
          jaigent models --only openai
          jaigent providers
          jaigent auth list
          jaigent settings list

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

  security:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit bandit
      - name: Dependency vulnerabilities
        # Audit runtime, build-system and every declared optional extra rather
        # than the editable project itself, which is not on PyPI.
        run: |
          python - <<'EOF' > requirements.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project = data["project"]
          requirements = [
              *project["dependencies"],
              *data["build-system"].get("requires", []),
              *(item for extra in project.get("optional-dependencies", {}).values() for item in extra),
          ]
          print("\n".join(sorted(set(requirements))) + "\n")
          EOF
          cat requirements.txt
          pip-audit --strict --desc -r requirements.txt
      - name: Static security analysis
        run: bandit -r src/jaigent -ll -x tests

  installers:
    name: installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sh -n packaging/install.sh
          shellcheck -s sh packaging/install.sh
      - name: Check install.ps1
        shell: pwsh
        run: |
          # Parse it without running it: a syntax error in an installer that
          # users pipe into their shell is not something to discover in the wild.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "packaging/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"
      - name: Asset names must match the release workflow
        run: |
          python - <<'EOF'
          import re, pathlib, sys
          release = pathlib.Path(".github/workflows/release.yml").read_text()
          published = set(re.findall(r"jaigent-(?:linux|macos|windows)-(?:x64|arm64)", release))
          expected = {f"jaigent-{os}-{arch}"
                      for os in ("linux", "macos") for arch in ("x64", "arm64")}
          expected.add("jaigent-windows-x64")
          missing = expected - published
          if missing:
              sys.exit(f"installers expect assets the release does not build: {missing}")
          print("asset names agree:", sorted(published))
          EOF

  build:
    name: build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
